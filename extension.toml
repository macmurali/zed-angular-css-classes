id = "angular-css-classes"
name = "Angular CSS Classes"
description = "Go to definition, hover, completion and references for CSS classes used in Angular templates."
version = "0.1.0"
schema_version = 1
authors = ["Murali <murali@qlarios.com>"]
repository = "https://github.com/your-name/zed-angular-css-classes"

[language_servers.angular-css-classes]
name = "Angular CSS Classes"
# "Angular" is the template language from the Angular extension (*.component.html);
# "HTML" covers every other .html file. CSS/SCSS/Less are attached so
# "Find All References" works from a selector back to the templates.
languages = ["HTML", "Angular", "CSS", "SCSS", "Less"]

[language_servers.angular-css-classes.language_ids]
"HTML" = "html"
"Angular" = "html"
"CSS" = "css"
"SCSS" = "scss"
"Less" = "less"
